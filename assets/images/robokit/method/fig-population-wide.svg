<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 96">
<style>
@keyframes sSmall{0%{opacity:0}12%,42%{opacity:1}56%,100%{opacity:0}}
@keyframes sElite{0%{opacity:0}12%,78%{opacity:1}92%,100%{opacity:0}}
@keyframes orbit{to{stroke-dashoffset:-18}}
.ring{animation:orbit 2.2s linear infinite}
.small{animation:sSmall 2.8s ease-in-out infinite}
.elite{animation:sElite 2.8s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
