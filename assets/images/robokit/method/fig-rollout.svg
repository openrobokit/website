<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 104 72">
<style>
@keyframes alt{0%,6%{stroke-dashoffset:90;opacity:1}30%,80%{stroke-dashoffset:0;opacity:1}92%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes best{0%,24%{stroke-dashoffset:110}62%,88%{stroke-dashoffset:0;opacity:1}96%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes hit{0%,58%{transform:scale(.6);opacity:.35}66%{transform:scale(1.35);opacity:1}76%,88%{transform:scale(1);opacity:1}96%,100%{transform:scale(.6);opacity:.35}}
.a{stroke-dasharray:90;animation:alt 3.6s ease-out infinite}.a2{animation-delay:.15s}
.b{stroke-dasharray:110;animation:best 3.6s ease-in-out infinite}
.t{transform-origin:82px 61px;animation:hit 3.6s ease-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;stroke-dasharray:none!important}}
</style>
<line x1="8" y1="62" x2="96" y2="62" stroke="#DCE5FC" stroke-width="2"></line>
<g fill="none" stroke="#B6C9F9" stroke-width="1.6" stroke-linecap="round">
<path class="a" d="M20,30 Q34,8 46,61"></path>
<path class="a a2" d="M20,30 Q50,0 74,61"></path>
</g>
<path class="b" d="M20,30 Q42,2 60,61 Q71,44 82,61" fill="none" stroke="#1F5EEA" stroke-width="2.2" stroke-linecap="round"></path>
<circle r="3.6" fill="#1F5EEA"><animateMotion dur="3.6s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.24;0.62;1" calcMode="linear" path="M20,30 Q42,2 60,61 Q71,44 82,61"></animateMotion></circle>
<circle cx="20" cy="30" r="5.5" fill="#1F5EEA"></circle>
<g class="t"><circle cx="82" cy="61" r="4.6" fill="#FF3B30"></circle><circle cx="82" cy="61" r="1.8" fill="#fff"></circle></g>
</svg>
