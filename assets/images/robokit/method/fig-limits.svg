<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 104 72">
<style>
@keyframes sweep{0%,10%{transform:rotate(-45deg)}38%{transform:rotate(142deg)}44%,60%{transform:rotate(135deg)}88%{transform:rotate(-52deg)}94%,100%{transform:rotate(-45deg)}}
@keyframes stopL{0%,8%{stroke:#1F5EEA;stroke-width:3.4}18%,82%{stroke:#C7D5F8;stroke-width:2.4}88%,92%{stroke:#E11D48;stroke-width:3.8}97%,100%{stroke:#1F5EEA;stroke-width:3.4}}
@keyframes stopR{0%,30%{stroke:#C7D5F8;stroke-width:2.4}37%,41%{stroke:#E11D48;stroke-width:3.8}47%,60%{stroke:#1F5EEA;stroke-width:3.4}72%,100%{stroke:#C7D5F8;stroke-width:2.4}}
.arm{transform-origin:54px 54px;animation:sweep 3.6s cubic-bezier(.4,.05,.3,1) infinite}
.sl{animation:stopL 3.6s ease-in-out infinite}.sr{animation:stopR 3.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<path d="M22,54 A32,32 0 0 1 86,54" fill="none" stroke="#B6C9F9" stroke-width="2.6"></path>
<line x1="14" y1="54" x2="94" y2="54" stroke="#E4EBFD" stroke-width="2"></line>
<g stroke-linecap="round">
<line class="sl" x1="22" y1="54" x2="14" y2="59.5" stroke="#C7D5F8" stroke-width="2.4"></line>
<line class="sr" x1="86" y1="54" x2="94" y2="59.5" stroke="#C7D5F8" stroke-width="2.4"></line>
</g>
<g class="arm"><line x1="54" y1="54" x2="31.4" y2="31.4" stroke="#1F5EEA" stroke-width="2.6" stroke-linecap="round"></line></g>
<circle cx="54" cy="54" r="3.4" fill="#1F5EEA"></circle>
</svg>
