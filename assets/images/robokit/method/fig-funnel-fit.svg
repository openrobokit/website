<svg xmlns="http://www.w3.org/2000/svg" viewBox="34 8 72 80">
<style>
@keyframes fallL{0%{transform:translate(0,-5px);opacity:0}10%{opacity:1}58%{transform:translate(15px,42px);opacity:1}82%,100%{transform:translate(15px,56px);opacity:0}}
@keyframes fallR{0%{transform:translate(0,-5px);opacity:0}10%{opacity:1}58%{transform:translate(-15px,41px);opacity:1}82%,100%{transform:translate(-15px,55px);opacity:0}}
@keyframes reject{0%{transform:translate(0,-6px) scale(1);opacity:0}10%{opacity:1}52%{transform:translate(0,38px) scale(1);opacity:1}62%{transform:translate(0,40px) scale(1);opacity:1}80%,100%{transform:translate(0,40px) scale(.2);opacity:0}}
@keyframes drip{0%,56%{opacity:0;transform:translate(0,-7px)}66%{opacity:1;transform:translate(0,-3px)}92%{opacity:1;transform:translate(0,2px)}100%{opacity:0;transform:translate(0,5px)}}
.in{animation-duration:3.6s;animation-timing-function:cubic-bezier(.45,.05,.6,1);animation-iteration-count:infinite}
.k{animation-name:fallL}
.x{animation-name:reject;transform-box:fill-box;transform-origin:center;animation-delay:1.2s}
.j{animation-name:fallR;animation-delay:.6s}
.drip{animation:drip 3.6s ease-in infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<circle class="in k" cx="55" cy="18" r="4" fill="#1F5EEA"></circle>
<circle class="in x" cx="70" cy="15" r="4" fill="#FF3B30"></circle>
<circle class="in j" cx="85" cy="19" r="4" fill="#B6C9F9"></circle>
<path d="M37.5,25 L102.5,25 L77.5,53.8 L77.5,75.4 L62.5,69.4 L62.5,53.8 Z" fill="#DCE5FC" stroke="#1F5EEA" stroke-width="2.3" stroke-linejoin="round"></path>
<circle class="drip" cx="70" cy="82" r="3" fill="#1F5EEA"></circle>
</svg>
