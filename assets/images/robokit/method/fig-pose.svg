<line class="xG" x1="36" y1="44" x2="20.3" y2="53.4" stroke="#34C759"></line><path class="hG" d="M16,56 L18.65,50.65 L21.95,56.15 Z" fill="#34C759"></path>
<circle class="hub" cx="36" cy="44" r="3.4" fill="#FFCC00"></circle>
</g>
