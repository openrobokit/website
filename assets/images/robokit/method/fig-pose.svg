<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 104 72">
<style>
@keyframes pose{0%,10%{transform:translate(0,0) scale(1)}44%,64%{transform:translate(30px,-14px) scale(.75)}92%,100%{transform:translate(0,0) scale(1)}}
@keyframes poseDim{0%,32%{opacity:1}46%,64%{opacity:.36}80%,100%{opacity:1}}
@keyframes sR{0%,34%{stroke:#FF3B30}46%,64%{stroke:#1F5EEA}78%,100%{stroke:#FF3B30}}
@keyframes fR{0%,34%{fill:#FF3B30}46%,64%{fill:#1F5EEA}78%,100%{fill:#FF3B30}}
@keyframes sG{0%,34%{stroke:#34C759}46%,64%{stroke:#1F5EEA}78%,100%{stroke:#34C759}}
@keyframes fG{0%,34%{fill:#34C759}46%,64%{fill:#1F5EEA}78%,100%{fill:#34C759}}
@keyframes fY{0%,34%{fill:#FFCC00}46%,64%{fill:#1F5EEA}78%,100%{fill:#FFCC00}}
@keyframes dash{to{stroke-dashoffset:-14}}
.src{transform-origin:36px 44px;animation:pose 3.4s cubic-bezier(.5,.02,.3,1) infinite,poseDim 3.4s ease-in-out infinite}
.xR{animation:sR 3.4s ease-in-out infinite}.hR{animation:fR 3.4s ease-in-out infinite}
.xG{animation:sG 3.4s ease-in-out infinite}.hG{animation:fG 3.4s ease-in-out infinite}
.hub{animation:fY 3.4s ease-in-out infinite}
.arc{animation:dash 1.2s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g opacity=".3" stroke="#1F5EEA" stroke-width="1.8" stroke-linecap="round" fill="#1F5EEA">
